name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Remove local Windows-only aapt2 override
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuGouLiteVipAutoClaim-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: KuGouLiteVipAutoClaim ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
